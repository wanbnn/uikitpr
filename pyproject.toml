[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uikitpr"
version = "0.3.2"
description = "Complete visual framework with components, motion, and events for PyReact"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "wanbnn", email = "wanbnn@users.noreply.github.com"},
]
keywords = [
  "pyreact",
  "prpm",
  "ui",
  "css",
  "utility-first",
  "components",
  "design-system",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = ["pyreact-framework>=1.0.5"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=5",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/wanbnn/uikitpr"
Documentation = "https://uikitpr.readthedocs.io"
Repository = "https://github.com/wanbnn/uikitpr"
Issues = "https://github.com/wanbnn/uikitpr/issues"

[project.scripts]
uikitpr = "uikitpr.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uikitpr = ["assets/*.css", "assets/*.js", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["uikitpr"]
branch = true

[tool.prpm.scripts]
test = "python -m pytest"
build = "python -m build"
check = "python -m twine check dist/*"
site = "python scripts/build_site.py"